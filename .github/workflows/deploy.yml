name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh market rates every weekday at 14:30 UTC (~9:30/10:30 AM New York),
    # after the daily Optimal Blue / Treasury prints are published.
    - cron: '30 14 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest mortgage & benchmark rates (FRED)
        run: node scripts/fetch-rates.mjs

      - name: Check refinance trigger
        id: alert
        run: node scripts/check-rate-alert.mjs

      - name: Open refinance alert issue (emails repo owner)
        if: steps.alert.outputs.status == 'refi'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.alert.outputs.body }}
          EFFECTIVE: ${{ steps.alert.outputs.effective }}
        run: |
          gh label create rate-alert --color E11D48 --description "Refinance trigger reached" --force --repo "$GITHUB_REPOSITORY"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label rate-alert --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label rate-alert \
              --title "🔔 Refi trigger hit: effective rate ${EFFECTIVE}%" \
              --body "$BODY"
          else
            echo "An open rate-alert issue already exists; not creating a duplicate."
          fi

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
